# ============================================================
# VoltTwin Backend Configuration
# ============================================================

spring.application.name=volttwin-backend

# --- H2 In-Memory Database ---
spring.datasource.url=jdbc:h2:mem:volttwin
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Data File Paths ---
# NOTE: Update these paths if running from a different directory
volttwin.data.cycle-summary-csv=../data/processed/battery_cycle_summary.csv
volttwin.data.telemetry-csv=../data/processed/B0005_high_freq_telemetry.csv

# --- ONNX Model Paths ---
volttwin.onnx.soh-model=../ml-models/soh_regressor.onnx
volttwin.onnx.rul-model=../ml-models/rul_regressor.onnx

# --- Weibull Parameters ---
volttwin.weibull.params-file=../data/processed/weibull_parameters.json

# --- JVM & Memory Controls ---
# Constrain embedded H2 cache size
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.open-in-view=false

# --- Server ---
server.port=8080

# --- Scheduling (for telemetry streaming) ---
spring.task.scheduling.pool.size=2
